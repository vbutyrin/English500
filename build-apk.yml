name: Сборка Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получение проекта
        uses: actions/checkout@v4
      - name: Настройка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Настройка Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Подготовка Android SDK
        uses: android-actions/setup-android@v3
      - name: Установка Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Сборка APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Проверка APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Публикация установочного APK
        uses: actions/upload-artifact@v4
        with:
          name: Английский-500-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
